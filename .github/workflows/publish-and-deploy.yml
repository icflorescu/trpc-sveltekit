name: Publish npm & deploy docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'icflorescu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/build
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            package/package.json
            package/README.md
            package/LICENSE
            package/dist

  # Publishes with npm trusted publishing (OIDC) - no NPM_TOKEN needed.
  # Configure it at https://www.npmjs.com/package/trpc-sveltekit/access
  # (workflow: publish-and-deploy.yml, environment: npm-registry).
  publish:
    if: github.repository_owner == 'icflorescu'
    environment:
      name: npm-registry
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Publish if version changed
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping."
            exit 0
          fi
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          npm publish --provenance --access public --tag "$TAG"

  deploy:
    if: github.repository_owner == 'icflorescu'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: [build, publish]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
