name: Publish npm & deploy docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Least privilege at the top level; jobs opt into more as needed
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'icflorescu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/build

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            package/package.json
            package/README.md
            package/LICENSE
            package/dist

  publish:
    if: github.repository_owner == 'icflorescu'
    environment:
      name: npm-registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Skip publishing when the package.json version is already on npm (e.g. docs-only merges).
      # Older npm versions print nothing for a missing version, so compare the output rather than
      # rely on the exit code; on any lookup error we fall through to publishing, which fails loudly
      # if something is wrong.
      - name: Check whether version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION is already published on npm, skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Prereleases (e.g. 4.1.0-next.0) go to the `next` dist-tag
          case "$VERSION" in *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      # Trusted Publishing requires npm >= 11.5.1
      - name: Update npm
        if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@latest

      # Stages the release via npm Trusted Publishing (OIDC; provenance is generated automatically).
      # A maintainer must approve it with 2FA before it goes public: find the stage id in this
      # step's log (`staged with id <uuid>`) or via `npm stage list trpc-sveltekit`, then run
      # `npm stage approve <uuid>`.
      - name: Stage npm release
        if: steps.check.outputs.skip != 'true'
        run: npm stage publish --access public --tag "${{ steps.check.outputs.tag }}"

  # Deploys the docs independently of publishing, so docs-only changes are never blocked
  deploy:
    if: github.repository_owner == 'icflorescu'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
